services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: careerloop
      POSTGRES_PASSWORD: careerloop
      POSTGRES_DB: careerloop
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerloop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
